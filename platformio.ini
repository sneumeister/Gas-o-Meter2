; gas-o-meter2 platformio.ini – ESP-IDF (pioarduino platform)
[platformio]
default_envs = PCB_20251022

;[env]
;lib_deps = 
;    bblanchon/ArduinoJson@^7.4.3
;    https://github.com/joltwallet/esp_littlefs.git
;lib_ldf_mode = chain

[env:espidf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_compat_mode = off
lib_deps = 
    bblanchon/ArduinoJson@^7.4.3
;    https://github.com/joltwallet/esp_littlefs.git@^1.20.3
lib_ldf_mode = chain
build_flags = 
    # Hilft dem HP-Core, die generierten ULP-Header im Build-Verzeichnis zu finden
    -I ${PROJECT_BUILD_DIR}/esp-idf/src
    -DTEMPLATE_PLACEHOLDER=96
    -DARDUINOJSON_ENABLE_PROGMEM=0
    # BUILD_TIMESTAMP wird jetzt in version.h aus __DATE__ und __TIME__ berechnet
    # ULP/LP-Core Konfiguration erfolgt über sdkconfig.defaults/sdkconfig.espidf:

# 2. Synchronisation zwischen PIO und CMake erzwingen
# Dies stellt sicher, dass CMake den LP-Core Zweig aktiviert, 
# selbst wenn die sdkconfig noch nicht fertig generiert wurde.
board_build.cmake_extra_args = 
    -DCONFIG_ULP_COPROC_ENABLED=y
    -DCONFIG_ULP_COPROC_TYPE_LP_CORE=y
    -DCONFIG_ULP_COPROC_RESERVE_MEM=4096
    # Für LittleFS Partition....
    #-DCONFIG_PARTITION_TABLE_CUSTOM=y
    #-DCONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
    #-DCONFIG_PARTITION_TABLE_FILENAME="partitions.csv"
    #-DCONFIG_PARTITION_TABLE_OFFSET=0x8000

; Platinenversion 20251022 (erste Revision, Default für "pio run")
; USB-Stromversorgung: Erkennung per ADC (battery_voltage < 2.0 V), kein VBUS-GPIO
[env:PCB_20251022]
extends = env:espidf
build_flags =
    ${env:espidf.build_flags}
    -DBOARD_VERSION_ID=20251022

; Platinenversion 20260523 (zweite Revision)
; USB-Stromversorgung: VBUS an GPIO18 (Pin11/D10) — HIGH = USB 5 V angeschlossen, LOW = Akku-Betrieb
; Build: pio run -e PCB_20260523
[env:PCB_20260523]
extends = env:espidf
build_flags =
    ${env:espidf.build_flags}
    -DBOARD_VERSION_ID=20260523

