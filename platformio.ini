; gas-o-meter2 platformio.ini – ESP-IDF (pioarduino platform)
[platformio]
default_envs = espidf

[env]
lib_deps = 
    bblanchon/ArduinoJson@^7.4.3
    https://github.com/joltwallet/esp_littlefs.git
lib_ldf_mode = chain

[env:espidf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
# WICHTIG: board_build.filesystem = littlefs NICHT für ESP-IDF verwenden!
# Stattdessen wird littlefs_create_partition_image() in CMakeLists.txt verwendet
# Dies ist die offizielle ESP-IDF-Methode laut https://github.com/joltwallet/esp_littlefs
lib_compat_mode = off
lib_deps = ${env.lib_deps}
build_flags = 
    # Hilft dem HP-Core, die generierten ULP-Header im Build-Verzeichnis zu finden
    -I ${PROJECT_DIR}/.pio/build/espidf/esp-idf/src
    -DTEMPLATE_PLACEHOLDER=96
    -DARDUINOJSON_ENABLE_PROGMEM=0
    # BUILD_TIMESTAMP wird jetzt in version.h aus __DATE__ und __TIME__ berechnet
    # ULP/LP-Core Konfiguration erfolgt über sdkconfig.defaults/sdkconfig.espidf:

# 2. Synchronisation zwischen PIO und CMake erzwingen
# Dies stellt sicher, dass CMake den LP-Core Zweig aktiviert, 
# selbst wenn die sdkconfig noch nicht fertig generiert wurde.
board_build.cmake_extra_args = 
    -DCONFIG_ULP_COPROC_ENABLED=y
    -DCONFIG_ULP_COPROC_TYPE_LP_CORE=y
    -DCONFIG_ULP_COPROC_RESERVE_MEM=4096
    # Für LittleFS Partition....
    #-DCONFIG_PARTITION_TABLE_CUSTOM=y
    #-DCONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
    #-DCONFIG_PARTITION_TABLE_FILENAME="partitions.csv"
    #-DCONFIG_PARTITION_TABLE_OFFSET=0x8000

