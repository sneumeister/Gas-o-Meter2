; gas-o-meter2 platformio.ini – ESP-IDF (pioarduino platform)
[platformio]
default_envs = PCB_20251022

[env:espidf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_compat_mode = off
lib_deps = 
    bblanchon/ArduinoJson@7.4.3

lib_ldf_mode = chain
build_flags = 
    # ULP-Header im Build-Verzeichnis (HP-Core)
    -I ${PROJECT_BUILD_DIR}/esp-idf/src
    -DTEMPLATE_PLACEHOLDER=96
    -DARDUINOJSON_ENABLE_PROGMEM=0
    # ZigBee-Fehlersuche: einkommentieren, bauen, flashen — danach wieder aus
    # -DGOM_ZIGBEE_DEBUG_LOG

# LP-Core: CMake-Zweig auch aktivieren, wenn sdkconfig noch nicht generiert ist
board_build.cmake_extra_args =
    -DCONFIG_ULP_COPROC_ENABLED=y
    -DCONFIG_ULP_COPROC_TYPE_LP_CORE=y
    -DCONFIG_ULP_COPROC_RESERVE_MEM=4096

; Platinenversion 20251022 (erste Revision, Default für "pio run")
; USB-Stromversorgung: Erkennung per ADC (battery_voltage < 2.0 V), kein VBUS-GPIO
[env:PCB_20251022]
extends = env:espidf
build_flags =
    ${env:espidf.build_flags}
    -DBOARD_VERSION_ID=20251022

; Platinenversion 20260523 (zweite Revision)
; USB-Stromversorgung: VBUS an GPIO18 (Pin11/D10) — HIGH = USB 5 V angeschlossen, LOW = Akku-Betrieb
; Build: pio run -e PCB_20260523
[env:PCB_20260523]
extends = env:espidf
build_flags =
    ${env:espidf.build_flags}
    -DBOARD_VERSION_ID=20260523

; TPL5110 / Reed Hardware-Test (minimal, ohne LP-Core/WiFi)
; Upload: pio run -e TPL_test -t upload
; Monitor: pio device monitor -e TPL_test
[env:TPL_test]
extends = env:espidf
lib_deps =
build_flags =
    -DTEMPLATE_PLACEHOLDER=96
board_build.cmake_extra_args =
    -DGOM_TPL_TEST=1
    -DCONFIG_ULP_COPROC_ENABLED=n

