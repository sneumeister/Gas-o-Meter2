# Gas-O-Meter2 ZigBee Device Definition
# Für ESP32C6 mit ESP-Zigbee-SDK
# 
# Installation:
# 1. Kopiere diese Datei nach: <zigbee2mqtt>/data/devices/custom/gas-o-meter2.yaml
# 2. Starte Zigbee2MQTT neu
# 3. Device wird automatisch erkannt (wenn model_id = "Gas-O-Meter2" im ESP-Code)

zigbeeModel: ['Gas-O-Meter2', 'gas-o-meter2']  # Model-Namen, die erkannt werden
model: 'gas-o-meter2'
vendor: 'Custom'
description: 'Gas-O-Meter with ZigBee Data Transfer'
whiteLabel: []

exposes:
  # Gas-Zählerstand (Analog Input Cluster 0x0400)
  - type: 'numeric'
    name: 'gas_counter'
    property: 'presentValue'
    access: 1  # read
    unit: 'pulses'
    value_min: 0
    value_max: 4294967295  # uint32_t max
    description: 'Gas pulse counter value'
  
  # Akku-Ladezustand (Battery Cluster 0x0001)
  - type: 'numeric'
    name: 'battery'
    property: 'batteryPercentageRemaining'
    access: 1  # read
    unit: '%'
    value_min: 0
    value_max: 100
    description: 'Battery charge level in percent'
  
  # Firmware-Version (Basic Cluster 0x0000)
  - type: 'text'
    name: 'firmware_version'
    property: 'appVersion'
    access: 1  # read
    description: 'Firmware version string'

fromZigbee:
  # Analog Input Cluster (0x0400) - Gas-Zählerstand
  - cluster: 'genAnalogInput'
    type: ['attributeReport', 'readResponse']
    convert: (model, msg, publish, options, meta) => {
      if (msg.data.hasOwnProperty('presentValue')) {
        return {gas_counter: msg.data.presentValue};
      }
    }
  
  # Battery Cluster (0x0001) - Akku
  - cluster: 'genPowerCfg'
    type: ['attributeReport', 'readResponse']
    convert: (model, msg, publish, options, meta) => {
      if (msg.data.hasOwnProperty('batteryPercentageRemaining')) {
        return {battery: msg.data.batteryPercentageRemaining};
      }
    }
  
  # Basic Cluster (0x0000) - Firmware-Version
  - cluster: 'genBasic'
    type: ['attributeReport', 'readResponse']
    convert: (model, msg, publish, options, meta) => {
      if (msg.data.hasOwnProperty('appVersion')) {
        return {firmware_version: msg.data.appVersion};
      }
    }

toZigbee: []  # Keine Commands nötig (nur Read-Only)

meta:
  configureKey: 1  # Für Pairing/Configuration

configure: async (device, coordinatorEndpoint, logger) => {
  // Konfiguration beim Pairing
  const endpoint = device.getEndpoint(1);
  
  // Battery Reporting konfigurieren
  await endpoint.configureReporting('genPowerCfg', [{
    attribute: 'batteryPercentageRemaining',
    minimumReportInterval: 3600,  // 1 Stunde
    maximumReportInterval: 86400,  // 24 Stunden
    reportableChange: 1,
  }], {manufacturerCode: null, disableDefaultResponse: true});
  
  // Analog Input Reporting konfigurieren
  await endpoint.configureReporting('genAnalogInput', [{
    attribute: 'presentValue',
    minimumReportInterval: 300,   // 5 Minuten
    maximumReportInterval: 3600,   // 1 Stunde
    reportableChange: 1,
  }], {manufacturerCode: null, disableDefaultResponse: true});
}
